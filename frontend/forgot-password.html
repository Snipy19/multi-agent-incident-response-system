<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reset Password — Incident Response Console</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
        background: #0b0f19; color: #e2e8f0; min-height: 100vh;
        display: flex; align-items: center; justify-content: center;
    }
    .auth-box {
        width: 380px; background: #111827; border: 1px solid #1f2937;
        border-radius: 12px; padding: 32px;
    }
    .brand-row { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; }
    .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, #3b82f6, #1e40af); }
    .brand-text { font-size: 14px; font-weight: 600; color: #f1f5f9; }
    h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; color: #f8fafc; }
    .subtitle { font-size: 13px; color: #64748b; margin-bottom: 24px; }
    label { font-size: 12px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 6px; }
    input {
        width: 100%; padding: 11px 14px; border-radius: 7px; margin-bottom: 16px;
        border: 1px solid #1f2937; background: #0b0f19; color: #e2e8f0; font-size: 14px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    button {
        width: 100%; padding: 11px; border-radius: 7px; border: none;
        background: #2563eb; color: white; font-size: 14px; font-weight: 600;
        cursor: pointer; margin-top: 4px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #334155; cursor: not-allowed; }
    .error-msg { color: #f87171; font-size: 13px; margin-bottom: 14px; display: none; }
    .success-msg { color: #4ade80; font-size: 13px; margin-bottom: 14px; display: none; }
    .toggle-row { text-align: center; margin-top: 18px; font-size: 13px; }
    .toggle-row a { color: #60a5fa; text-decoration: none; cursor: pointer; }
</style>
</head>
<body>
<!-- Password recovery uses a short-lived OTP delivered by the configured
     email provider before the backend accepts a new password. -->

<div class="auth-box">
    <div class="brand-row">
        <div class="brand-mark"></div>
        <span class="brand-text">Incident Response Console</span>
    </div>

    <div id="step1">
        <h1>Reset Password</h1>
        <p class="subtitle">Enter your username to receive a one-time code by email.</p>
        <div class="error-msg" id="errorMsg1"></div>
        <label>Username</label>
        <input type="text" id="username" placeholder="yourusername">
        <button onclick="sendOtp()" id="sendBtn">Send OTP</button>
    </div>

    <div id="step2" style="display:none;">
        <h1>Enter New Password</h1>
        <p class="subtitle">Check your email for the 6-digit code.</p>
        <div class="error-msg" id="errorMsg2"></div>
        <div class="success-msg" id="successMsg2"></div>
        <label>OTP Code</label>
        <input type="text" id="otp" placeholder="123456" maxlength="6">
        <label>New Password</label>
        <input type="password" id="newPassword" placeholder="••••••••">
        <button onclick="resetPassword()" id="resetBtn">Reset Password</button>
    </div>

    <div class="toggle-row">
        <a onclick="window.location.href='login.html'">Back to Sign In</a>
    </div>
</div>

<script>
    const API_BASE = window.location.port === "8000"
        ? window.location.origin
        : "http://127.0.0.1:8000";
    let savedUsername = "";

    async function sendOtp() {
        const username = document.getElementById("username").value.trim();
        const errorMsg = document.getElementById("errorMsg1");
        const btn = document.getElementById("sendBtn");

        errorMsg.style.display = "none";

        if (!username) {
            errorMsg.textContent = "Please enter your username.";
            errorMsg.style.display = "block";
            return;
        }

        btn.disabled = true;
        btn.textContent = "Sending...";

        try {
            const res = await fetch(`${API_BASE}/forgot-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username })
            });

            if (!res.ok) {
                const data = await res.json();
                throw new Error(data.detail || "Something went wrong");
            }

            savedUsername = username;
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";

        } catch (err) {
            errorMsg.textContent = err.message;
            errorMsg.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.textContent = "Send OTP";
        }
    }

    async function resetPassword() {
        const otp = document.getElementById("otp").value.trim();
        const newPassword = document.getElementById("newPassword").value;
        const errorMsg = document.getElementById("errorMsg2");
        const successMsg = document.getElementById("successMsg2");
        const btn = document.getElementById("resetBtn");

        errorMsg.style.display = "none";
        successMsg.style.display = "none";

        if (!otp || !newPassword) {
            errorMsg.textContent = "Please fill in both fields.";
            errorMsg.style.display = "block";
            return;
        }

        btn.disabled = true;
        btn.textContent = "Resetting...";

        try {
            const res = await fetch(`${API_BASE}/reset-password`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username: savedUsername, otp, new_password: newPassword })
            });

            const data = await res.json();

            if (!res.ok) {
                throw new Error(data.detail || "Something went wrong");
            }

            successMsg.textContent = "Password reset! Redirecting to sign in...";
            successMsg.style.display = "block";
            setTimeout(() => window.location.href = "login.html", 2000);

        } catch (err) {
            errorMsg.textContent = err.message;
            errorMsg.style.display = "block";
        } finally {
            btn.disabled = false;
            btn.textContent = "Reset Password";
        }
    }
</script>
</body>
</html>
