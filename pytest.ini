[pytest]
testpaths = tests
# Keep pytest's temporary databases and cache inside the project workspace.
# This avoids Windows permission failures when the user-level Temp directory
# is restricted by antivirus, corporate policy, or a managed Python install.
addopts = -ra --basetemp=.pytest_tmp
cache_dir = .pytest_cache_local
markers =
    live: tests that call the real Groq API and load the real RAG model/index
