services:
  incident-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-response-api
    init: true
    # Keep local Docker from allowing the embedding stack to consume the host.
    # Raise this only after measuring a real workload, not during image builds.
    mem_limit: 2g
    cpus: 2.0
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Keep local defaults, but allow deployment .env values to control the
      # security mode, allowed browser origins, and listening port.
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://127.0.0.1:8000,http://localhost:8000}
      PORT: ${PORT:-8000}
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TORCH_NUM_THREADS: "1"
    volumes:
      # Development-only SQLite persistence. Replace this with RDS settings
      # and remove the volume when deploying the production database.
      - ./db:/app/db
    restart: unless-stopped
