name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python tests and validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q auth.py graph.py main.py state.py agents db utils vectorstore tests

      - name: Verify dependency consistency
        run: pip check

      - name: Run automated tests
        env:
          ENVIRONMENT: test
          JWT_SECRET_KEY: ci-only-test-secret
        run: python -m pytest -q
